name: ci

# Entry point for ordinary development. Pull requests get a full FreeBSD build, lint and style run
# but publish nothing; pushes to main and v* tags publish to the pkg repository and the releases.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      publish: ${{ github.event_name == 'push' }}
      release_tag: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
    secrets: inherit
