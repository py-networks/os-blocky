{#
 # Generated by OPNsense. Do not edit, changes are overwritten on every apply.
 # Configuration reference: https://0xerr0r.github.io/blocky/latest/configuration/
 #
 # Only current option names are emitted here. blocky still accepts the pre-0.22 spellings
 # (upstream, blackLists, port, logLevel, ...) but logs a deprecation error for them.
 #}
{% set general = OPNsense.Blocky.general %}
{% set upstreams = OPNsense.Blocky.upstreams %}
{% set blocking = OPNsense.Blocky.blocking %}
{% set customdns = OPNsense.Blocky.customdns %}
{% set conditional = OPNsense.Blocky.conditional %}
{% set caching = OPNsense.Blocky.caching %}
{% set querylog = OPNsense.Blocky.querylog %}
{% set encryption = OPNsense.Blocky.encryption %}
{% set advanced = OPNsense.Blocky.advanced %}
{% set ns = namespace(upstream_groups={}, denylists={}, allowlists={}) %}
{% for item in helpers.toList('OPNsense.Blocky.upstreams.upstream') %}
{% if item.enabled == '1' and item.address != '' %}
{% do ns.upstream_groups.setdefault(item.group, []).append(item.address) %}
{% endif %}
{% endfor %}
{% for item in helpers.toList('OPNsense.Blocky.blocking.denylist') %}
{% if item.enabled == '1' %}
{% do ns.denylists.setdefault(item.group, []).append(item) %}
{% endif %}
{% endfor %}
{% for item in helpers.toList('OPNsense.Blocky.blocking.allowlist') %}
{% if item.enabled == '1' %}
{% do ns.allowlists.setdefault(item.group, []).append(item) %}
{% endif %}
{% endfor %}
# This file is managed by OPNsense. Manual changes will be overwritten.

{% if ns.upstream_groups %}
upstreams:
  init:
    strategy: {{ upstreams.init_strategy }}
  strategy: {{ upstreams.strategy }}
  timeout: {{ upstreams.timeout }}
{% if not helpers.empty('OPNsense.Blocky.upstreams.user_agent') %}
  userAgent: "{{ upstreams.user_agent }}"
{% endif %}
  groups:
{% for group, addresses in ns.upstream_groups.items() %}
    {{ group }}:
{% for address in addresses %}
      - "{{ address }}"
{% endfor %}
{% endfor %}

{% endif %}
connectIPVersion: {{ general.connect_ip_version }}

{% if not helpers.empty('OPNsense.Blocky.general.bootstrap_dns') %}
bootstrapDns:
{% for resolver in general.bootstrap_dns.split(',') %}
  - "{{ resolver | trim }}"
{% endfor %}

{% endif %}
ports:
  dns:
{% for listener in general.listen_address.split(',') %}
    - "{{ listener | trim }}"
{% endfor %}
  http: "127.0.0.1:{{ general.api_port }}"
{% if not helpers.empty('OPNsense.Blocky.encryption.tls_port') %}
  tls:
{% for listener in encryption.tls_port.split(',') %}
    - "{{ listener | trim }}"
{% endfor %}
{% endif %}
{% if not helpers.empty('OPNsense.Blocky.encryption.https_port') %}
  https:
{% for listener in encryption.https_port.split(',') %}
    - "{{ listener | trim }}"
{% endfor %}
{% endif %}
  dohPath: "{{ encryption.doh_path }}"

{% if not helpers.empty('OPNsense.Blocky.encryption.certificate') %}
certFile: /usr/local/etc/blocky/cert.pem
keyFile: /usr/local/etc/blocky/key.pem
{% endif %}
minTlsServeVersion: "{{ encryption.min_tls_version }}"

http3:
  enable: {{ 'true' if encryption.http3 == '1' else 'false' }}

{% if ns.denylists or ns.allowlists %}
blocking:
{% if ns.denylists %}
  denylists:
{% for group, items in ns.denylists.items() %}
    {{ group }}:
{% for item in items %}
{% if item.source_type == 'inline' %}
      - |
{{ item.content | trim | indent(8, true) }}
{% else %}
      - "{{ item.source }}"
{% endif %}
{% endfor %}
{% endfor %}
{% endif %}
{% if ns.allowlists %}
  allowlists:
{% for group, items in ns.allowlists.items() %}
    {{ group }}:
{% for item in items %}
{% if item.source_type == 'inline' %}
      - |
{{ item.content | trim | indent(8, true) }}
{% else %}
      - "{{ item.source }}"
{% endif %}
{% endfor %}
{% endfor %}
{% endif %}
{% set clientgroups = [] %}
{% for item in helpers.toList('OPNsense.Blocky.clientgroups.clientgroup') %}
{% if item.enabled == '1' %}
{% do clientgroups.append(item) %}
{% endif %}
{% endfor %}
{#
 # An empty clientGroupsBlock would serialise as null, which blocky reports as a schema mismatch.
 # Blocking is inactive without it either way, so the key is left out entirely.
 #}
{% if clientgroups %}
  clientGroupsBlock:
{% for item in clientgroups %}
    "{{ item.client }}":
{% for group in item.groups.split(',') %}
      - {{ group | trim }}
{% endfor %}
{% endfor %}
{% endif %}
  blockType: {{ blocking.block_type }}
  blockTTL: {{ blocking.block_ttl }}
{% set schedules = [] %}
{% for item in helpers.toList('OPNsense.Blocky.schedules.schedule') %}
{% if item.enabled == '1' %}
{% do schedules.append(item) %}
{% endif %}
{% endfor %}
{% if schedules %}
  schedules:
{% for item in schedules %}
    {{ item.name }}:
      weekdays: [{{ item.weekdays.split(',') | map('trim') | join(', ') }}]
      start: "{{ item.start }}"
      end: "{{ item.end }}"
{% endfor %}
{% set listschedules = [] %}
{% for item in helpers.toList('OPNsense.Blocky.schedules.listschedule') %}
{% if item.enabled == '1' %}
{% do listschedules.append(item) %}
{% endif %}
{% endfor %}
{% if listschedules %}
  listSchedules:
{% for item in listschedules %}
    {{ item.group }}:
{% for name in item.schedules.split(',') %}
      - {{ name | trim }}
{% endfor %}
{% endfor %}
{% endif %}
{% endif %}
  loading:
    refreshPeriod: {{ blocking.refresh_period }}
    strategy: {{ blocking.loading_strategy }}
    concurrency: {{ blocking.concurrency }}
    maxErrorsPerSource: {{ blocking.max_errors_per_source }}
    downloads:
      timeout: {{ blocking.download_timeout }}
      attempts: {{ blocking.download_attempts }}
      cooldown: {{ blocking.download_cooldown }}
{% if blocking.cache_downloads == '1' %}
      cachePath: /var/cache/blocky/lists
{% endif %}

{% endif %}
{% set customdns_mappings = [] %}
{% for item in helpers.toList('OPNsense.Blocky.customdns.mapping') %}
{% if item.enabled == '1' %}
{% do customdns_mappings.append(item) %}
{% endif %}
{% endfor %}
{% set customdns_rewrites = [] %}
{% for item in helpers.toList('OPNsense.Blocky.customdns.rewrite') %}
{% if item.enabled == '1' %}
{% do customdns_rewrites.append(item) %}
{% endif %}
{% endfor %}
{% if customdns_mappings or customdns_rewrites %}
customDNS:
  customTTL: {{ customdns.custom_ttl }}
  filterUnmappedTypes: {{ 'true' if customdns.filter_unmapped_types == '1' else 'false' }}
{% if customdns_rewrites %}
  rewrite:
{% for item in customdns_rewrites %}
    {{ item.from }}: {{ item.to }}
{% endfor %}
{% endif %}
{% if customdns_mappings %}
  mapping:
{% for item in customdns_mappings %}
    {{ item.host }}: "{{ item.addresses.split(',') | map('trim') | join(',') }}"
{% endfor %}
{% endif %}

{% endif %}
{% set conditional_mappings = [] %}
{% for item in helpers.toList('OPNsense.Blocky.conditional.mapping') %}
{% if item.enabled == '1' %}
{% do conditional_mappings.append(item) %}
{% endif %}
{% endfor %}
{% if conditional_mappings %}
conditional:
  fallbackUpstream: {{ 'true' if conditional.fallback_upstream == '1' else 'false' }}
  mapping:
{% for item in conditional_mappings %}
    "{{ item.domain }}": "{{ item.resolvers.split(',') | map('trim') | join(',') }}"
{% endfor %}

{% endif %}
caching:
  minTime: {{ caching.min_time }}
  maxTime: {{ caching.max_time }}
  maxItemsCount: {{ caching.max_items_count }}
  cacheTimeNegative: {{ caching.cache_time_negative }}
  prefetching: {{ 'true' if caching.prefetching == '1' else 'false' }}
{% if caching.prefetching == '1' %}
  prefetchExpires: {{ caching.prefetch_expires }}
  prefetchThreshold: {{ caching.prefetch_threshold }}
  prefetchMaxItemsCount: {{ caching.prefetch_max_items_count }}
{% endif %}

queryLog:
  type: {{ querylog.type }}
{% if querylog.type in ['csv', 'csv-client'] %}
  target: /var/log/blocky/querylog
  logRetentionDays: {{ querylog.log_retention_days }}
  flushInterval: {{ querylog.flush_interval }}
{% endif %}
{% if not helpers.empty('OPNsense.Blocky.querylog.fields') %}
  fields:
{% for field in querylog.fields.split(',') %}
    - {{ field | trim }}
{% endfor %}
{% endif %}

{% if not helpers.empty('OPNsense.Blocky.advanced.hosts_file_sources') %}
hostsFile:
  sources:
{% for source in advanced.hosts_file_sources.split(',') %}
    - "{{ source | trim }}"
{% endfor %}
  hostsTTL: {{ advanced.hosts_ttl }}
  filterLoopback: {{ 'true' if advanced.hosts_filter_loopback == '1' else 'false' }}

{% endif %}
{% if not helpers.empty('OPNsense.Blocky.advanced.client_lookup_upstream') %}
clientLookup:
  upstream: "{{ advanced.client_lookup_upstream }}"

{% endif %}
{% if not helpers.empty('OPNsense.Blocky.advanced.filter_query_types') %}
filtering:
  queryTypes:
{% for qtype in advanced.filter_query_types.split(',') %}
    - {{ qtype | trim }}
{% endfor %}

{% endif %}
fqdnOnly:
  enable: {{ 'true' if advanced.fqdn_only == '1' else 'false' }}

ede:
  enable: {{ 'true' if advanced.ede == '1' else 'false' }}

ecs:
  useAsClient: {{ 'true' if advanced.ecs_use_as_client == '1' else 'false' }}
  forward: {{ 'true' if advanced.ecs_forward == '1' else 'false' }}

specialUseDomains:
  enable: {{ 'true' if advanced.special_use_domains == '1' else 'false' }}

dnssec:
  validate: {{ 'true' if advanced.dnssec_validate == '1' else 'false' }}

rebindingProtection:
  enable: {{ 'true' if advanced.rebinding_protection == '1' else 'false' }}
{% if not helpers.empty('OPNsense.Blocky.advanced.rebinding_allowed_domains') %}
  allowedDomains:
{% for domain in advanced.rebinding_allowed_domains.split(',') %}
    - "{{ domain | trim }}"
{% endfor %}
{% endif %}

rateLimit:
  enable: {{ 'true' if advanced.rate_limit | int > 0 else 'false' }}
  rate: {{ advanced.rate_limit }}

log:
  level: {{ general.log_level }}
  privacy: {{ 'true' if general.log_privacy == '1' else 'false' }}

prometheus:
  enable: {{ 'true' if general.enable_metrics == '1' else 'false' }}

statistics:
  enable: {{ 'true' if general.enable_statistics == '1' else 'false' }}
