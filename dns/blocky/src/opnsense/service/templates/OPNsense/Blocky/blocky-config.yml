{#
 # Generated by OPNsense. Do not edit, changes are overwritten on every apply.
 # Configuration reference: https://0xerr0r.github.io/blocky/latest/configuration/
 #}
{% set general = OPNsense.Blocky.general %}
{% set upstreams = OPNsense.Blocky.upstreams %}
{% set ns = namespace(groups={}) %}
{% for item in helpers.toList('OPNsense.Blocky.upstreams.upstream') %}
{% if item.enabled == '1' and item.address != '' %}
{% do ns.groups.setdefault(item.group, []).append(item.address) %}
{% endif %}
{% endfor %}
# This file is managed by OPNsense. Manual changes will be overwritten.

{% if ns.groups %}
upstreams:
  init:
    strategy: {{ upstreams.init_strategy }}
  strategy: {{ upstreams.strategy }}
  timeout: {{ upstreams.timeout }}
  groups:
{% for group, addresses in ns.groups.items() %}
    {{ group }}:
{% for address in addresses %}
      - {{ address }}
{% endfor %}
{% endfor %}

{% endif %}
connectIPVersion: {{ general.connect_ip_version }}

{% if not helpers.empty('OPNsense.Blocky.general.bootstrap_dns') %}
bootstrapDns:
{% for resolver in general.bootstrap_dns.split(',') %}
  - {{ resolver | trim }}
{% endfor %}

{% endif %}
ports:
  dns:
{% for listener in general.listen_address.split(',') %}
    - {{ listener | trim }}
{% endfor %}
  http: 127.0.0.1:{{ general.api_port }}

log:
  level: {{ general.log_level }}
  privacy: {{ 'true' if general.log_privacy == '1' else 'false' }}

prometheus:
  enable: {{ 'true' if general.enable_metrics == '1' else 'false' }}

statistics:
  enable: {{ 'true' if general.enable_statistics == '1' else 'false' }}
